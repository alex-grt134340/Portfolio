<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Portfolio - Goret Alexandra</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Anti-Flash Blanc & Anti-Flash Langue -->
    <script>
        (function () {
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-theme');
            }

            var savedLang = localStorage.getItem('lang') || 'fr';
            document.documentElement.lang = savedLang;

            if (savedLang === 'en') {
                document.documentElement.classList.add('i18n-loading');
            }
        })();
    </script>
</head>

<body>
    <header>
        <div class="header-container">
            <div class="profile-pic-wrapper">
                <img src="assets/images/photo.jpg" alt="Alexandra Goret" width="180" height="180" class="profile-pic">
            </div>
            <div class="header-text">
                <h1>Goret Alexandra</h1>
                <p class="description" data-i18n="hero-title">Étudiante en développement de jeux vidéo</p>
            </div>
            <a href="documents/CV_Goret_Alexandra.pdf" class="cv-button" target="_blank" rel="noopener noreferrer"
                data-i18n="cv-button">
                Télécharger mon CV
            </a>
        </div>
    </header>

    <nav class="navigation">
        <a href="index.html" data-i18n="nav-home">Accueil</a>
        <a href="a-propos.html" data-i18n="nav-about">À propos de moi</a>
        <a href="competences.html" data-i18n="nav-skills">Compétences</a>
        <a href="projets.html" data-i18n="nav-projects">Projets</a>
        <a href="contact.html" data-i18n="nav-contact">Contact</a>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Changer de thème">
            <span id="theme-icon">☀️</span>
        </button>
        <button id="lang-toggle" class="lang-toggle-btn" aria-label="Changer de langue">
            <span id="lang-text">EN</span>
        </button>
    </nav>

    <section>
        <h2>Portfolio</h2>
        <div class="about-box">
            <p class="highlight-text" data-i18n="portfolio-intro"></p>
            <p data-i18n="portfolio-overview"></p>
            <p data-i18n="portfolio-structure"></p>

            <ul class="tech-tags">
                <li>HTML5</li>
                <li>CSS3</li>
                <li>JavaScript</li>
                <li>localStorage</li>
                <li>Google Fonts</li>
                <li>Visual Studio Code</li>
            </ul>
        </div>
    </section>

    <section>
        <h3 data-i18n="portfolio-contrib-title"></h3>
        <div class="contributions">
            <article class="contribution">
                <div class="contribution-text about-box">
                    <h4 class="tech-accent" data-i18n="portfolio-feat-dev-title"></h4>
                    <p data-i18n="portfolio-feat-dev-desc"></p>
                    <ul>
                        <li data-i18n="portfolio-feat-dev-p1"></li>
                        <li data-i18n="portfolio-feat-dev-p2"></li>
                        <li data-i18n="portfolio-feat-dev-p3"></li>
                    </ul>
                </div>
                <figure class="contribution-media">
                    <img src="assets/images/portfolio/design.png" alt="Aperçu du design du portfolio" loading="lazy">
                    <figcaption data-i18n="portfolio-feat-dev-caption"></figcaption>
                </figure>
            </article>

            <article class="contribution reverse">
                <div class="contribution-text about-box">
                    <h4 class="tech-accent" data-i18n="portfolio-feat-theme-title"></h4>
                    <p data-i18n="portfolio-feat-theme-desc"></p>
                    <ul>
                        <li data-i18n="portfolio-feat-theme-p1"></li>
                        <li data-i18n="portfolio-feat-theme-p2"></li>
                        <li data-i18n="portfolio-feat-theme-p3"></li>
                    </ul>
                </div>
                <figure class="contribution-media">
                    <img src="assets/images/portfolio/theme.png" alt="Comparaison du thème clair et du thème sombre"
                        loading="lazy">
                    <figcaption data-i18n="portfolio-feat-theme-caption"></figcaption>
                </figure>
            </article>

            <article class="contribution">
                <div class="contribution-text about-box">
                    <h4 class="tech-accent" data-i18n="portfolio-feat-lang-title"></h4>
                    <p data-i18n="portfolio-feat-lang-desc"></p>
                    <ul>
                        <li data-i18n="portfolio-feat-lang-p1"></li>
                        <li data-i18n="portfolio-feat-lang-p2"></li>
                        <li data-i18n="portfolio-feat-lang-p3"></li>
                    </ul>
                </div>
                <figure class="contribution-media">
                    <img src="assets/images/portfolio/lang.png" alt="Le site en français et en anglais" loading="lazy">
                    <figcaption data-i18n="portfolio-feat-lang-caption"></figcaption>
                </figure>
            </article>

            <article class="contribution reverse">
                <div class="contribution-text about-box">
                    <h4 class="tech-accent" data-i18n="portfolio-feat-a11y-title"></h4>
                    <p data-i18n="portfolio-feat-a11y-desc"></p>
                    <ul>
                        <li data-i18n="portfolio-feat-a11y-p1"></li>
                        <li data-i18n="portfolio-feat-a11y-p2"></li>
                        <li data-i18n="portfolio-feat-a11y-p3"></li>
                    </ul>
                </div>
                <figure class="contribution-media">
                    <img src="assets/images/portfolio/bouton.png" Navigation et boutons du portfolio" loading="lazy">
                    <figcaption data-i18n="portfolio-feat-a11y-caption"></figcaption>
                </figure>
            </article>
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
